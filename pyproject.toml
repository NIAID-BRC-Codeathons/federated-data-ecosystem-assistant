[project]
name = "federated-data-ecosystem-assistant"
version = "0.0.1"
requires-python = "==3.13.*"

dependencies = [
    # Capped below 2.0 deliberately. `mcp.server.fastmcp`, which every server in
    # mcp_servers/ imports, is a tombstone in mcp 2.x that raises on import.
    # Without the cap, regenerating uv.lock breaks all four servers at once.
    "mcp >=1.15.0,<2",
    "requests >=2.34.2",
    # mcp_servers/ncbi_lib uses an async client so its tools can share one
    # rate limiter; httpx arrives with mcp anyway, declared so it is not
    # relying on a transitive dep staying transitive.
    "httpx >=0.28",
    "chainlit >=2.8.1",
    "langchain >=1.3.1",
    "langchain-mcp-adapters >=0.2.2",
    "langchain-openai >=1.2.1",
    "langchain-ollama >=1.1.0",
    "langchain-mistralai >=1.1.4",
    "langchain-anthropic >=1.7.2",
    "SQLAlchemy >=2.0.40",
    "aiosqlite >=0.22.1",
    "greenlet >=3.5.1",
]

[dependency-groups]
dev = ["pytest >=8.0", "pytest-asyncio >=0.24"]

[tool.pytest.ini_options]
testpaths = ["tests"]
# The NCBI tools are async (see mcp_servers/ncbi_lib/server.py); "auto" saves
# marking each of their tests. The mygene and uniprot suites are sync and are
# unaffected.
asyncio_mode = "auto"
markers = [
    "live: hits the real NCBI API; deselected by default (run with -m live)",
]
# Live tests are opt-in: they are slow at NCBI's 3/sec ceiling and spend a
# shared per-IP budget, so a plain `pytest` must not fire them.
addopts = "-m 'not live'"
