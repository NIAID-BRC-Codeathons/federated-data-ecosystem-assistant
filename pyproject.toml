[project]
name = "fdea-ncbi-mcp"
version = "0.1.0"
description = "MCP server exposing NCBI E-utilities (SRA, BioSample, BioProject, PubMed, Taxonomy, Gene, Assembly, sequences) to an agent."
requires-python = ">=3.10"
dependencies = [
    "fastmcp>=4.0",
    # fastmcp depends on httpx2, NOT httpx: `import httpx` fails in a clean
    # install of this package. httpx2.AsyncClient is API-compatible, so most
    # httpx snippets port unchanged --- but the import line does not. Declared
    # explicitly rather than relying on a transitive dep staying transitive.
    "httpx2>=2.5",
    # For typing.Self on Python 3.10, which this package still supports.
    # Arrives transitively via pydantic today; declared for the same reason
    # httpx2 is.
    "typing-extensions>=4.0",
]

[project.optional-dependencies]
dev = ["pytest", "pytest-asyncio"]

[project.scripts]
fdea-ncbi-mcp = "ncbi_mcp.__main__:main"

[build-system]
requires = ["setuptools>=61"]
build-backend = "setuptools.build_meta"

[tool.setuptools]
packages = ["ncbi_mcp"]

[tool.pytest.ini_options]
asyncio_mode = "auto"
markers = [
    "live: hits the real NCBI API; deselected by default (run with -m live)",
]
addopts = "-m 'not live'"
